AWSTemplateFormatVersion: '2010-09-09'
Description: >
  LuminaLab Swarm - Production-Ready Serverless AWS Infrastructure (IaC).
  Provisions an isolated S3 Vault Bucket (with Web CORS), DynamoDB Impact Ledger,
  and Least-Privilege IAM Policy for zero-maintenance operation.

Parameters:
  EnvironmentName:
    Type: String
    Default: prod
    Description: Deployment environment identifier (e.g. prod, staging, dev).
    AllowedPattern: ^[a-zA-Z0-9_-]+$

  BillingMode:
    Type: String
    Default: PAY_PER_REQUEST
    AllowedValues:
      - PAY_PER_REQUEST
      - PROVISIONED
    Description: DynamoDB billing mode. PAY_PER_REQUEST provides $0.00 idle base cost.

Resources:
  # 1. S3 Vault Bucket for Standalone Labs & Polly Audio
  LuminaLabVaultBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      CorsConfiguration:
        CorsRules:
          - Id: LuminaWebStreamingRule
            AllowedHeaders:
              - '*'
            AllowedMethods:
              - GET
              - HEAD
            AllowedOrigins:
              - '*'
            MaxAge: 86400
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
      Tags:
        - Key: Project
          Value: LuminaLab-Swarm
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: ManagedBy
          Value: LuminaLab-IaC

  # 2. DynamoDB Impact Ledger Table
  LuminaLabImpactTable:
    Type: AWS::DynamoDB::Table
    Properties:
      AttributeDefinitions:
        - AttributeName: session_id
          AttributeType: S
      KeySchema:
        - AttributeName: session_id
          KeyType: HASH
      BillingMode: !Ref BillingMode
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - Key: Project
          Value: LuminaLab-Swarm
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: ManagedBy
          Value: LuminaLab-IaC

  # 3. Least-Privilege Application IAM Policy
  LuminaLabSwarmPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Description: Least-privilege IAM policy granting LuminaLab Swarm access to S3, DynamoDB, Polly, and Bedrock.
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          # S3 Vault Access
          - Sid: S3LabVaultAccess
            Effect: Allow
            Action:
              - s3:PutObject
              - s3:GetObject
              - s3:ListBucket
            Resource:
              - !GetAtt LuminaLabVaultBucket.Arn
              - !Sub "${LuminaLabVaultBucket.Arn}/*"

          # DynamoDB Impact Ledger Access
          - Sid: DynamoImpactLedgerAccess
            Effect: Allow
            Action:
              - dynamodb:PutItem
              - dynamodb:GetItem
              - dynamodb:Scan
              - dynamodb:UpdateItem
            Resource:
              - !GetAtt LuminaLabImpactTable.Arn

          # Amazon Polly Narration Access
          - Sid: AmazonPollySpeechAccess
            Effect: Allow
            Action:
              - polly:SynthesizeSpeech
              - polly:DescribeVoices
            Resource: '*'

          # AWS Bedrock Foundation Models (Optional / if invoked via IAM)
          - Sid: BedrockInferenceAccess
            Effect: Allow
            Action:
              - bedrock:InvokeModel
              - bedrock:InvokeModelWithResponseStream
            Resource: '*'

Outputs:
  S3BucketName:
    Description: Name of the generated LuminaLab S3 Vault Bucket.
    Value: !Ref LuminaLabVaultBucket
    Export:
      Name: !Sub "${AWS::StackName}-S3BucketName"

  DynamoTableName:
    Description: Name of the generated DynamoDB Impact Ledger table.
    Value: !Ref LuminaLabImpactTable
    Export:
      Name: !Sub "${AWS::StackName}-DynamoTableName"

  AwsRegion:
    Description: AWS region where resources are deployed.
    Value: !Ref "AWS::Region"

  IamPolicyArn:
    Description: ARN of the generated least-privilege IAM managed policy.
    Value: !Ref LuminaLabSwarmPolicy
